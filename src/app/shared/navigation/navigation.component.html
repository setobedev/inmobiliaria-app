@if (showNavigation()) {
  <mat-sidenav-container class="sidenav-container">
  <!-- Menu izquierdo -->
  <mat-sidenav
    #sidenavLeft
    fixedInViewport
    class="sidenav"
    position="start"
    [opened]="false"
    [ngClass]="{ phone: breakpointsService.isPhone(), tablet: breakpointsService.isTablet() }"
    [mode]="breakpointsService.isMobile() ? 'over' : 'side'"
    [attr.role]="breakpointsService.isMobile() ? 'dialog' : 'navigation'"
  >
    <mat-toolbar class="toolbar-sidenav justify-between">
      Menu izquierdo
      <button
        matIconButton
        type="button"
        aria-label="Toggle sidenav"
        (click)="sidenavLeft.toggle()"
      >
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
    </mat-toolbar>
    <mat-nav-list>
      <a mat-list-item href="#">Link 1</a>
      <a mat-list-item href="#">Link 2</a>
      <a mat-list-item href="#">Link 3</a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Contenido principal -->
  <mat-sidenav-content>
    <app-header>
      <app-navbar-menu [sidenavLeft]="sidenavLeft" [sidenavRight]="sidenavRight"></app-navbar-menu>
    </app-header>
    <div class="content">
        <ng-container *ngTemplateOutlet="content"></ng-container>
    </div>
    <app-footer></app-footer>
  </mat-sidenav-content>

  <!-- Menu derecho -->
  <mat-sidenav
    #sidenavRight
    fixedInViewport
    position="end"
    class="sidenav"
    [opened]="false"
    [ngClass]="{ phone: breakpointsService.isPhone(), tablet: breakpointsService.isTablet() }"
    [mode]="breakpointsService.isMobile() ? 'over' : 'side'"
    [attr.role]="breakpointsService.isMobile() ? 'dialog' : 'navigation'"
  >
    <mat-toolbar class="toolbar-sidenav justify-between">
      <button
        matIconButton
        type="button"
        aria-label="Toggle sidenav"
        (click)="sidenavRight.toggle()"
      >
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      Menu derecho
    </mat-toolbar>
    <mat-nav-list>
      <a mat-list-item href="#">Link 1</a>
      <a mat-list-item href="#">Link 2</a>
      <a mat-list-item href="#">Link 3</a>
    </mat-nav-list>
  </mat-sidenav>
</mat-sidenav-container>
} @else {
  <ng-container *ngTemplateOutlet="content"></ng-container>
}

<ng-template #content>
  <ng-content></ng-content>
</ng-template>
